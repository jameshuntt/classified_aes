[package]
name = "classified_aes"
version = "0.2.1"
edition = "2021"
rust-version = "1.71"
license = "MIT OR Apache-2.0"
description = "AES with classified keys and plaintexts: honest_aes (no lookup tables) driven by ClassifiedBytes keys, sealing and opening ClassifiedBuffer material with GCM, plus CMAC, CTR and CBC."
authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/jameshuntt/classified_aes"
readme = "README.md"
keywords = ["aes", "gcm", "zeroize", "constant-time", "security"]
categories = ["cryptography"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["os-rng"]
# `Nonce::random()` from the operating system's generator.
os-rng = ["dep:rand_core", "rand_core/os_rng"]

[dependencies]
classified = { version = "0.2.0", path = "../classified" }
honest_aes = { version = "0.1.0", path = "../honest_aes" }
rand_core = { version = "0.9", optional = true }

[dev-dependencies]
aes = "0.8"
aes-gcm = "0.10"

[[example]]
name = "wrap_key"
required-features = ["os-rng"]
